{% extends 'base.html' %}
{% block title %}{{ action }} Course{% endblock %}
{% block content %}
<div class="container">
    <h2 class="section-title text-center" style="display:block;text-align:center;">{{ action }} Course</h2>
    <form method="post" enctype="multipart/form-data" class="styled-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success" style="width:100%;">Save Course</button>
    </form>
</div>
{% endblock %}
